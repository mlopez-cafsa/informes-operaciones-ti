<script src="assets/js/color-semaforo.js"></script>
<script src="assets/js/brief-viewer.js" defer></script>
<script>
(function () {
  const grid = document.getElementById('grid-informes');
  const cards = Array.from(grid.querySelectorAll('.informe-card'));
  const buscador = document.getElementById('buscador');
  const orden = document.getElementById('orden');
  const filtros = document.getElementById('filtros');

  let filtroActivo = 'todos';

  function normalizar(texto) {
    return texto
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
  }

  const PRIORIDAD_PESO = { alta: 0, media: 1, baja: 2, '': 3 };
  const ESTADO_PESO = { rojo: 0, amarillo: 1, neutral: 2, verde: 3 };

  // ---------------------------------------------------------------------
  // B\u00fasqueda flexible/aproximada (2026-09-23, a pedido de Marco: "la
  // b\u00fasqueda debe ser flexible... todo lo relacionado o aproximado a la
  // b\u00fasqueda", con resultado pr\u00e1ctico que muestre la tarea de referencia
  // y el redireccionamiento a ella).
  //
  // Reemplaza el `includes()` de una sola frase exacta por:
  //   1. Tokens: la b\u00fasqueda se parte en palabras: cada palabra se busca
  //      por separado (AND entre ellas) \u2014 no importa el orden ni que sea
  //      la frase completa ("core financiero" y "financiero core"
  //      encuentran lo mismo).
  //   2. Tolerancia a errores: si una palabra de 4+ letras no aparece
  //      como substring exacto, se acepta si hay una palabra parecida
  //      (distancia de edici\u00f3n <=1, o <=2 en palabras largas) \u2014 cubre
  //      typos y variantes ("salesforc" ~ "salesforce").
  //   3. Tres capas de datos por card: lo visible (t\u00edtulo/resumen/
  //      categor\u00eda/estado/prioridad), lo "extra" (nombres de fase, texto
  //      real pero no impreso en la card) y las referencias Jira (ticket +
  //      resumen de cada subtarea). Si el match solo aparece en la
  //      tercera capa, se informa cu\u00e1l fue la referencia y se linkea
  //      directo a Jira \u2014 la card no se limita a "aparecer en la lista"
  //      sin explicar por qu\u00e9.
  // ---------------------------------------------------------------------

  function distanciaEdicion(a, b, limite) {
    if (Math.abs(a.length - b.length) > limite) return limite + 1;
    const fila = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) fila[j] = j;
    for (let i = 1; i <= a.length; i++) {
      let anterior = fila[0];
      fila[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const temp = fila[j];
        fila[j] = a[i - 1] === b[j - 1]
          ? anterior
          : 1 + Math.min(anterior, fila[j], fila[j - 1]);
        anterior = temp;
      }
    }
    return fila[b.length];
  }

  function coincideAproximado(palabraTexto, token) {
    if (palabraTexto.length < 3 || token.length < 3) return false;
    const limite = token.length >= 7 ? 2 : 1;
    return distanciaEdicion(palabraTexto, token, limite) <= limite;
  }

  // token encontrado en `texto` (substring exacto, o aproximado contra
  // cada palabra del texto si el token tiene 4+ letras).
  function tokenEnTexto(texto, token) {
    if (!texto) return false;
    if (texto.includes(token)) return true;
    if (token.length < 4) return false;
    return texto.split(/[^a-z0-9]+/).some(palabra => coincideAproximado(palabra, token));
  }

  const referenciasCache = new WeakMap();
  function referenciasDe(card) {
    if (referenciasCache.has(card)) return referenciasCache.get(card);
    let refs = [];
    try {
      refs = JSON.parse(card.dataset.referencias || '[]').map(r => ({
        ...r,
        _busq: normalizar(`${r.key || ''} ${r.resumen || ''}`),
      }));
    } catch (e) { /* referencias mal formadas: se ignoran, no rompe la b\u00fasqueda */ }
    referenciasCache.set(card, refs);
    return refs;
  }

  function evaluarCard(card, tokens) {
    if (tokens.length === 0) return { visible: true, score: 0, coincidenciaExtra: null };
    const visibleTxt = card.dataset.busqueda || '';
    const extraTxt = card.dataset.extra || '';
    const refs = referenciasDe(card);
    let score = 0;
    let coincidenciaExtra = null;

    for (const token of tokens) {
      if (visibleTxt.includes(token)) { score += 3; continue; }
      if (tokenEnTexto(visibleTxt, token)) { score += 2; continue; }
      if (tokenEnTexto(extraTxt, token)) { score += 1; continue; }
      const ref = refs.find(r => tokenEnTexto(r._busq, token));
      if (ref) {
        score += 1;
        if (!coincidenciaExtra) coincidenciaExtra = ref;
        continue;
      }
      return { visible: false, score: 0, coincidenciaExtra: null }; // token sin match -> descarta (AND)
    }
    return { visible: true, score, coincidenciaExtra };
  }

  function aplicarFiltros() {
    const termino = normalizar(buscador.value.trim());
    const tokens = termino ? termino.split(/\s+/).filter(Boolean) : [];

    cards.forEach(card => {
      const coincideCategoria = filtroActivo === 'todos' || card.dataset.categoria === filtroActivo;
      const { visible: coincideBusqueda, score, coincidenciaExtra } = evaluarCard(card, tokens);
      const visible = coincideCategoria && coincideBusqueda;
      card.style.display = visible ? '' : 'none';
      card.dataset.score = score;

      const pista = card.querySelector('.coincidencia-busqueda');
      if (pista) {
        if (visible && coincidenciaExtra) {
          const key = coincidenciaExtra.key ? `${coincidenciaExtra.key} \u2014 ` : '';
          const texto = `Coincide con: ${key}${coincidenciaExtra.resumen || ''}`;
          if (coincidenciaExtra.url) {
            pista.innerHTML = `${texto.replace(/</g, '&lt;')} <a href="${coincidenciaExtra.url}" target="_blank" rel="noopener">Ver en Jira &rarr;</a>`;
          } else {
            pista.textContent = texto;
          }
          pista.hidden = false;
        } else {
          pista.hidden = true;
          pista.textContent = '';
        }
      }
    });

    // Con b\u00fasqueda activa, lo m\u00e1s relevante primero (m\u00e1s tokens
    // encontrados y en el lugar m\u00e1s visible de la card); sin b\u00fasqueda,
    // manda el criterio del selector "Ordenar por".
    if (tokens.length > 0) {
      const ordenadas = [...cards].sort((a, b) => (Number(b.dataset.score) || 0) - (Number(a.dataset.score) || 0));
      ordenadas.forEach(card => grid.appendChild(card));
    } else {
      aplicarOrden();
    }
  }

  function aplicarOrden() {
    const criterio = orden.value;
    const ordenadas = [...cards].sort((a, b) => {
      if (criterio === 'atencion') {
        // Prioridad de atención (2026-09-23): ranking explícito 1..N
        // declarado a mano por Marco en data/informes.json
        // (orden_atencion), NO calculado — distinto del Radar de
        // urgencia del sidebar (ese sí es automático, por fecha de
        // vencimiento en Jira, y no se toca acá). Informes sin este
        // campo declarado se mandan al final (999).
        return (Number(a.dataset.ordenAtencion) || 999) - (Number(b.dataset.ordenAtencion) || 999);
      }
      if (criterio === 'prioridad') {
        return PRIORIDAD_PESO[a.dataset.prioridad] - PRIORIDAD_PESO[b.dataset.prioridad];
      }
      if (criterio === 'estado') {
        return ESTADO_PESO[a.dataset.estado] - ESTADO_PESO[b.dataset.estado];
      }
      if (criterio === 'titulo') {
        return a.querySelector('h3').textContent.localeCompare(b.querySelector('h3').textContent, 'es');
      }
      // 'recientes': por fecha descendente
      return b.dataset.fecha.localeCompare(a.dataset.fecha);
    });
    ordenadas.forEach(card => grid.appendChild(card));
  }

  buscador.addEventListener('input', aplicarFiltros);
  orden.addEventListener('change', aplicarOrden);

  filtros.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      filtros.querySelectorAll('button').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      filtroActivo = btn.dataset.filtro;
      aplicarFiltros();
    });
  });

  // Header con sombra al hacer scroll (sticky ya es CSS; esto solo refuerza contraste).
  const header = document.getElementById('site-header');
  window.addEventListener('scroll', () => {
    header.classList.toggle('con-sombra', window.scrollY > 4);
  }, { passive: true });

  // Sidebar "Mi seguimiento (Jira)" — mostrar/ocultar (2026-09-18).
  // El estado inicial (colapsado o no) ya se aplicó en el <script> propio
  // que genera render_panel_consolidado(), justo después del <aside>, para
  // evitar el parpadeo de "se ve abierto y luego se cierra". Este bloque
  // solo conecta el click. Si no hay snapshot de Jira todavía, ni el
  // <aside> ni el botón existen y este bloque no encuentra nada que
  // conectar (comprobación de null de rigor, sin romper el resto del script).
  const sidebarJira = document.getElementById('sidebar-jira');
  const btnToggleSidebar = document.getElementById('btn-toggle-sidebar-jira');
  const backdropSidebar = document.getElementById('sidebar-jira-backdrop');
  const contenidoPrincipal = document.getElementById('contenido');
  if (sidebarJira && btnToggleSidebar) {
    const CLAVE_LOCALSTORAGE = 'sidebarJiraColapsado';
    const aplicarEstadoSidebar = (colapsado) => {
      sidebarJira.classList.toggle('colapsado', colapsado);
      btnToggleSidebar.classList.toggle('colapsado', colapsado);
      btnToggleSidebar.setAttribute('aria-expanded', String(!colapsado));
      btnToggleSidebar.setAttribute('aria-label', colapsado
        ? 'Mostrar panel Mi seguimiento (Jira)'
        : 'Ocultar panel Mi seguimiento (Jira)');
      // Al ocultar el panel, el contenido central se recentra liberando
      // el carril que tenía reservado (petición explícita, 2026-09-30) —
      // ver .main-index.sidebar-colapsado en style.css.
      if (contenidoPrincipal) contenidoPrincipal.classList.toggle('sidebar-colapsado', colapsado);
      // Fondo semitransparente detrás del panel, solo visible en pantallas
      // angostas (ver @media max-width:900px en style.css) — deja claro
      // que el panel es un overlay temporal y permite cerrarlo tocando
      // fuera de él, sin tener que ubicar el botón flotante.
      if (backdropSidebar) backdropSidebar.classList.toggle('visible', !colapsado);
    };
    btnToggleSidebar.addEventListener('click', () => {
      const colapsado = !sidebarJira.classList.contains('colapsado');
      aplicarEstadoSidebar(colapsado);
      localStorage.setItem(CLAVE_LOCALSTORAGE, colapsado ? '1' : '0');
    });
    if (backdropSidebar) {
      backdropSidebar.addEventListener('click', () => {
        aplicarEstadoSidebar(true);
        localStorage.setItem(CLAVE_LOCALSTORAGE, '1');
      });
    }
  }

  aplicarFiltros();
})();
</script>
